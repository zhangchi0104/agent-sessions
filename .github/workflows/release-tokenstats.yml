name: Release TokenStats

# On every push to main or dev that touches the TokenStats app, semantic-release
# inspects the conventional-commit history, computes the next version, then
# builds + codesigns (Developer ID) + notarizes a .dmg and publishes it as a
# GitHub Release asset under a `tokenstats-v<version>` tag.
#   - dev  -> beta prereleases, e.g. tokenstats-v1.2.0-beta.1 (marked pre-release)
#   - main -> stable releases,  e.g. tokenstats-v1.2.0
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   MACOS_CERT_P12_BASE64   base64 of a "Developer ID Application" cert + key (.p12)
#   MACOS_CERT_PASSWORD     password for that .p12
#   KEYCHAIN_PASSWORD       any throwaway password for the temp CI keychain
#   NOTARY_KEY_P8_BASE64    base64 of the App Store Connect API key (.p8)
#   NOTARY_KEY_ID           App Store Connect API Key ID
#   NOTARY_ISSUER_ID        App Store Connect Issuer ID
# (GITHUB_TOKEN is provided automatically.)

on:
  push:
    branches: [main, dev]
    paths:
      - "apps/TokenStats/**"
      - ".github/workflows/release-tokenstats.yml"
  workflow_dispatch:

permissions:
  contents: write # create tags + releases
  issues: write # semantic-release release comments
  pull-requests: write

concurrency:
  group: release-tokenstats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26 # provides the Xcode 26.6 toolchain required by release artifacts
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
          persist-credentials: false

      - name: Select Xcode 26.6
        run: |
          set -euo pipefail
          XC=/Applications/Xcode_26.6.app
          if [[ ! -d "$XC" ]]; then
            echo "error: required Xcode is unavailable at $XC" >&2
            exit 1
          fi
          sudo xcode-select -switch "$XC"
          XCODE_VERSION="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          case "$XCODE_VERSION" in
            26.6|26.6.*) ;;
            *)
              echo "error: expected Xcode 26.6.x, got ${XCODE_VERSION}" >&2
              exit 1
              ;;
          esac
          xcodebuild -version

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Test release candidate
        working-directory: apps/TokenStats
        run: npm test

      - name: Import signing certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          CERT="$RUNNER_TEMP/cert.p12"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$MACOS_CERT_PASSWORD" \
            -t cert -f pkcs12 -k "$KEYCHAIN" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Put our keychain first in the search list so codesign finds the identity.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed 's/[\" ]//g')
          rm -f "$CERT"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Prepare notarization key
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Release
        working-directory: apps/TokenStats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_NUMBER: ${{ github.run_number }}
          NOTARY_KEY_PATH: ${{ env.NOTARY_KEY_PATH }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          npx --yes \
            -p semantic-release@24 \
            -p @semantic-release/commit-analyzer \
            -p @semantic-release/release-notes-generator \
            -p @semantic-release/exec \
            -p @semantic-release/github \
            semantic-release

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
