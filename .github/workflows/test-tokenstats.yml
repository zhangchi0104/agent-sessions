name: Test TokenStats

# Runs the safe, non-UI `npm test` entry point for TokenStats-affecting pull
# requests and release-branch pushes, then explicitly opts into UI automation
# on the runner's isolated macOS desktop.

on:
  push:
    branches: [main, dev]
    paths:
      - "apps/TokenStats/**"
      - ".github/workflows/test-tokenstats.yml"
  pull_request:
    paths:
      - "apps/TokenStats/**"
      - ".github/workflows/test-tokenstats.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-tokenstats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26 # matches the release runner and its required Xcode toolchain
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        run: |
          set -euo pipefail
          XC=/Applications/Xcode_26.6.app
          if [[ ! -d "$XC" ]]; then
            echo "error: required Xcode is unavailable at $XC" >&2
            exit 1
          fi
          sudo xcode-select -switch "$XC"
          XCODE_VERSION="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          case "$XCODE_VERSION" in
            26.6|26.6.*) ;;
            *)
              echo "error: expected Xcode 26.6.x, got ${XCODE_VERSION}" >&2
              exit 1
              ;;
          esac
          xcodebuild -version

      - name: Static checks and unit tests
        working-directory: apps/TokenStats
        run: npm test

      - name: UI tests (isolated CI desktop)
        working-directory: apps/TokenStats
        run: npm run test:ui
