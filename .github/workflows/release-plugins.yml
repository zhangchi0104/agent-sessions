name: Publish release branch

# Builds the plugin bundles and republishes the `release` branch = latest main
# plus the built `plugins/*/bin/agent-sessions-cli.js`. The bundles are gitignored
# on source branches; the `release` branch is what users add as a marketplace:
#   /plugin marketplace add https://github.com/zhangchi0104/agent-sessions.git#release

on:
  push:
    branches: [main]
    paths:
      - "apps/agent-sessions-cli/**"
      - "packages/actions/**"
      - "packages/database/**"
      - "plugins/**"
      - ".claude-plugin/**"
      - "bun.lock"
      - ".github/workflows/release-plugins.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-branch
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `…actions...` scopes to @repo/actions and its deps (@repo/database),
      # excluding the macOS-only TokenStats app (would fail on Linux).
      - name: Build CLI dependencies
        run: bunx turbo run build --filter='@repo/actions...'

      - name: Bundle the plugin CLI
        working-directory: apps/agent-sessions-cli
        run: bun run build:bundle

      - name: Publish release branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B release
          git add -f plugins/*/bin/agent-sessions-cli.js
          git commit -m "chore(release): build plugin bundles from ${GITHUB_SHA}"
          git push --force origin release
